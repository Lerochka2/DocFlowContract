spring.application.name=docflow-backend

server.port=8080

# Error responses
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/docflow_contract
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${DOCFLOW_JWT_SECRET}
app.jwt.expiration-minutes=60

# File storage
app.storage.path=${DOCFLOW_STORAGE_PATH:../storage}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# AI service
app.ai.base-url=http://127.0.0.1:8000