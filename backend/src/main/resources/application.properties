spring.application.name=docflow-backend

server.port=8080

# Error responses
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/docflow_contract
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${DOCFLOW_JWT_SECRET}
app.jwt.expiration-minutes=60

# File storage
app.storage.path=${DOCFLOW_STORAGE_PATH:../storage}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# AI service
app.ai.base-url=http://127.0.0.1:8000

# ==========================================================
# RABBITMQ
# ==========================================================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=docflow
spring.rabbitmq.password=docflow123

# =========================================================
# RABBITMQ ENABLE / DISABLE
# =========================================================
docflow.rabbitmq.enabled=false


# ============================================================
# DOCFLOW MAIL CONFIG
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${DOCFLOW_MAIL_USERNAME:}
spring.mail.password=${DOCFLOW_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# SMTP diagnostics
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# ============================================================
# APPROVAL SLA
# ============================================================

# Срок этапа согласования задаётся при создании этапа: 2 дня.
# Планировщик проверяет активные этапы раз в минуту.
docflow.approval-sla.enabled=true
docflow.approval-sla.reminder-hours=24
docflow.approval-sla.cron=0 * * * * *
